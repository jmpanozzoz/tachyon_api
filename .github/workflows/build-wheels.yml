name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - "tachyon_api/**"
      - "tests/**"
      - "scripts/**"
      - "MANIFEST.in"
      - "poetry.lock"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/build-wheels.yml"

jobs:
  build_wheels:
    name: ${{ matrix.os }} · ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          # macOS Intel users build from the sdist.
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: AMD64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (Linux aarch64 cross-build)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - name: Rebuild native wheel from sdist and test outside checkout
        run: |
          mkdir -p /tmp/tachyon-sdist-source /tmp/tachyon-sdist-wheels /tmp/tachyon-sdist-tests
          tar -xzf dist/*.tar.gz -C /tmp/tachyon-sdist-source
          project_root="$PWD"
          cd /tmp/tachyon-sdist-source/*
          python -m build --wheel --outdir /tmp/tachyon-sdist-wheels
          pip install /tmp/tachyon-sdist-wheels/*.whl pytest pytest-asyncio httpx
          cd "$project_root"
          python scripts/test_installed_wheel.py --engine native

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  collect:
    name: Collect dist/
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-all
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    # Only on version tags — never for PRs or manual runs against branches.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-all
          path: dist

      - name: List artifacts to publish
        run: ls -la dist/

      - name: Publish wheels + sdist to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
