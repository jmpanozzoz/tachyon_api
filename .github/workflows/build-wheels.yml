name: Build distributions

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "tachyon_api/**"
      - "tests/**"
      - "scripts/**"
      - "MANIFEST.in"
      - "poetry.lock"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/build-wheels.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: python scripts/check_release_artifacts.py dist --version "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')"
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - run: pip install build pytest pytest-asyncio httpx
      - name: Install portable wheel
        run: python -c "import glob, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0]], check=True)"
      - run: python scripts/test_installed_wheel.py
      - name: Rebuild and install source distribution
        run: python -c "import glob, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', glob.glob('dist/*.tar.gz')[0]], check=True)"
      - run: python scripts/test_installed_wheel.py

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
