name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.14.9
      - run: ruff check tachyon_api tests benchmark scripts

  test-pure-python:
    name: Tests (pure Python, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install portable package
        run: |
          pip install --upgrade pip
          pip install -e ".[granian]"
          pip install -r scripts/test-requirements.txt
      - name: Run test suite
        run: python scripts/quality_cycle.py --engine python --output quality-python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-python-${{ matrix.python }}
          path: quality-python.json
