name: tachyon-reference
x-reference: &reference
  build:
    context: ..
    dockerfile: example/Dockerfile
  environment: &environment
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DEBUG: "false"
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in example/.env}
    DATABASE_URL: postgresql+asyncpg://tachyon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in example/.env}@postgres:5432/tachyon
    REDIS_URL: redis://redis:6379/0
    SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
  init: true
  mem_limit: 512m
  cpus: 1.0
  stop_grace_period: 25s
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  postgres:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_USER: tachyon
      POSTGRES_DB: tachyon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in example/.env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tachyon -d tachyon"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    cpus: 1.0
  redis:
    image: redis:8-bookworm@sha256:b0b01167ff47bc3868e56a967895a26be4230891a1f42a78ab61cdd227accc8d
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.5
  migrate:
    <<: *reference
    command: ["python", "-m", "alembic", "-c", "example/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    <<: *reference
    ports: ["127.0.0.1:${REFERENCE_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
  worker:
    <<: *reference
    command: ["python", "-m", "example.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  postgres-data:
