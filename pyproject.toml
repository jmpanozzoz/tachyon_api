[tool.poetry]
name = "tachyon-api"
version = "1.4.1"
description = "A lightweight, FastAPI-inspired web framework"
authors = ["Juan Manuel Panozzo Zénere <jm.panozzozenere@gmail.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
include = [
    { path = "setup.py",                  format = ["sdist"] },
    { path = "MANIFEST.in",               format = ["sdist"] },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
starlette = "^1.3.1"
uvicorn = "^0.35.0"
httptools = ">=0.6.0"
msgspec = "^0.19.0"
typer = "^0.16.0"
orjson = ">=3.11.6,<4.0"
python-multipart = "^0.0.32"
httpx = { version = "^0.28.1", optional = true }
granian = { version = "^2.8.7", optional = true }
# Optional — only pulled in via the [benchmark] extra:
fastapi = { version = ">=0.162.0,<1.0", optional = true }
pydantic = { version = "^2.13.4", optional = true }

[tool.poetry.extras]
# Compatibility alias for existing installations; deprecated since 1.4.1.
fast = []
test = ["httpx"]
granian = ["granian"]
# Only needed to run benchmark/run_benchmark.sh (Tachyon vs FastAPI).
benchmark = ["fastapi", "pydantic"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
httpx = "^0.28.1"
ruff = "0.14.9"

[tool.poetry.scripts]
tachyon = "tachyon_api.cli:app"

[build-system]
requires = ["poetry-core>=1.5.0", "setuptools>=61"]
build-backend = "setuptools.build_meta"
